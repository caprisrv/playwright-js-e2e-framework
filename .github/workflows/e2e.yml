name: E2E Tests
run-name: >-
  ${{ inputs.execution_mode == 'automatic-retry'
    && format('Retry Failed Tests - Run ID {0} - Attempt {1}', inputs.retry_run_id, inputs.retry_attempt)
    || 'E2E Tests' }}

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run tests from'
        required: true
        default: 'main'
        type: string

      tag:
        description: 'Test tag'
        required: true
        default: '@regression'
        type: string

      scenarios_per_shard:
        description: 'Scenarios per shard'
        required: true
        default: '2'
        type: number

      max_retries:
        description: 'Maximum retry attempts'
        required: true
        default: '2'
        type: number

      execution_mode:
        description: 'Execution mode'
        required: true
        default: 'full-suite'
        type: choice
        options:
          - full-suite
          - automatic-retry
          - historical-validation

      source_run_id:
        description: 'Source framework run ID for historical validation'
        required: false
        type: string

      retry_run_id:
        description: 'Logical framework run ID for automatic retry'
        required: false
        type: string

      retry_attempt:
        description: 'Retry attempt number'
        required: false
        default: '0'
        type: number

      source_workflow_run_id:
        description: 'Previous GitHub Actions run ID containing retry results'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  discover:
    name: Discover Tests
    runs-on: ubuntu-latest

    outputs:
      shard_plan: ${{ steps.prepare-shard-plan.outputs.shard_plan }}

    env:
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      ENVIRONMENT: qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download retry plan
        if: ${{ inputs.execution_mode == 'automatic-retry' }}
        uses: actions/download-artifact@v4
        with:
          name: retry-plan-${{ inputs.source_workflow_run_id }}-attempt-${{ inputs.retry_attempt }}
          path: artifacts/retry-plan
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_workflow_run_id }}

      - name: Create full-suite shard plan
        if: ${{ inputs.execution_mode == 'full-suite' }}
        run: |
          mkdir -p artifacts

          node scripts/discover-tests.js \
            --tag "${{ inputs.tag || '@regression' }}" \
            --scenarios-per-shard "${{ inputs.scenarios_per_shard || '2' }}" \
            > artifacts/shard-plan.json

      - name: Create historical validation shard plan
        if: ${{ inputs.execution_mode == 'historical-validation' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p artifacts

          node scripts/create-historical-validation-plan.js \
            --source-run-id "${{ inputs.source_run_id }}" \
            --scenarios-per-shard "${{ inputs.scenarios_per_shard || '2' }}" \
            --output artifacts/shard-plan.json

      - name: Prepare shard plan
        id: prepare-shard-plan
        run: |
          mkdir -p artifacts

          if [ "${{ inputs.execution_mode }}" = "automatic-retry" ]; then
            RETRY_PLAN_FILE="$(find artifacts/retry-plan -type f -name 'retry-plan.json' -print -quit)"

            if [ -z "$RETRY_PLAN_FILE" ]; then
              echo "Retry plan file not found."
              exit 1
            fi

            cp "$RETRY_PLAN_FILE" artifacts/shard-plan.json
          fi

          echo "shard_plan=$(jq -c . artifacts/shard-plan.json)" >> "$GITHUB_OUTPUT"

      - name: Upload shard plan
        uses: actions/upload-artifact@v4
        with:
          name: shard-plan
          path: artifacts/shard-plan.json
          retention-days: 14

  execute-shards:
    name: Execute Shard ${{ matrix.shard.shard }}
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.discover.outputs.shard_plan).shards }}

    env:
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      ENVIRONMENT: qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Display shard plan
        run: |
          echo "Shard: ${{ matrix.shard.shard }}"
          echo "Scenarios:"

          node -e '
            const shard = ${{ toJSON(matrix.shard) }};
            for (const test of shard.tests) {
              console.log(`- ${test.file}:${test.line} - ${test.title}`);
            }
          '

      - name: Create shard file
        run: |
          mkdir -p artifacts

          node -e '
            const fs = require("node:fs");

            const shard = ${{ toJSON(matrix.shard) }};

            fs.writeFileSync(
              `artifacts/shard-${shard.shard}.json`,
              JSON.stringify(shard, null, 2),
            );
          '

      - name: Execute shard
        run: |
          EXECUTION_TYPE="initial"
          ATTEMPT="0"

          if [ "${{ inputs.execution_mode }}" = "automatic-retry" ]; then
            EXECUTION_TYPE="retry"
            ATTEMPT="${{ inputs.retry_attempt }}"
          fi

          echo "Execution type: $EXECUTION_TYPE"
          echo "Attempt: $ATTEMPT"

          node scripts/execute-shard.js \
            --shard-file "artifacts/shard-${{ matrix.shard.shard }}.json" \
            --run-id "${{ inputs.retry_run_id || github.run_id }}" \
            --execution-type "$EXECUTION_TYPE" \
            --attempt "$ATTEMPT"

      - name: Upload execution result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-result-${{ github.run_id }}-shard-${{ matrix.shard.shard }}-attempt-${{ inputs.retry_attempt || '0' }}
          path: artifacts/${{ inputs.retry_run_id || github.run_id }}/${{ inputs.execution_mode == 'automatic-retry' && 'retry' || 'initial' }}-shard-${{ matrix.shard.shard }}-attempt-${{ inputs.retry_attempt || '0' }}.json
          retention-days: 14
  collect-execution-results:
    name: Collect Execution Results
    needs: execute-shards
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    env:
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      ENVIRONMENT: qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set execution context
        id: execution-context
        run: |
          EXECUTION_TYPE="initial"
          ATTEMPT="0"

          if [ "${{ inputs.execution_mode }}" = "automatic-retry" ]; then
            EXECUTION_TYPE="retry"
            ATTEMPT="${{ inputs.retry_attempt }}"
          fi

          NEXT_ATTEMPT=$((ATTEMPT + 1))

          echo "EXECUTION_TYPE=$EXECUTION_TYPE" >> "$GITHUB_ENV"
          echo "ATTEMPT=$ATTEMPT" >> "$GITHUB_ENV"
          echo "NEXT_ATTEMPT=$NEXT_ATTEMPT" >> "$GITHUB_ENV"

          echo "next_attempt=$NEXT_ATTEMPT" >> "$GITHUB_OUTPUT"

          echo "Execution type: $EXECUTION_TYPE"
          echo "Attempt: $ATTEMPT"
          echo "Next attempt: $NEXT_ATTEMPT"

      - name: Download execution results
        uses: actions/download-artifact@v4
        with:
          pattern: execution-result-${{ github.run_id }}-shard-*-attempt-${{ inputs.retry_attempt || '0' }}
          path: artifacts/execution-results
          merge-multiple: true

      - name: Display collected results
        run: |
          echo "Collected execution results:"
          find artifacts/execution-results -type f -print

      - name: Create retry plan
        run: |
          mkdir -p artifacts/retry

          NEXT_ATTEMPT=$((ATTEMPT + 1))

          node scripts/create-retry-plan.js \
            --results-directory "artifacts/execution-results" \
            --scenarios-per-shard "${{ inputs.scenarios_per_shard || '2' }}" \
            --attempt "$NEXT_ATTEMPT" \
            --output "artifacts/retry/retry-plan.json"

      - name: Display retry plan
        run: |
          echo "Generated retry plan:"
          cat artifacts/retry/retry-plan.json

      - name: Upload retry plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retry-plan-${{ github.run_id }}-attempt-${{ steps.execution-context.outputs.next_attempt }}
          path: artifacts/retry/retry-plan.json
          retention-days: 14

      - name: Dispatch next retry
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ inputs.branch || 'main' }}
          TAG: ${{ inputs.tag || '@regression' }}
          SCENARIOS_PER_SHARD: ${{ inputs.scenarios_per_shard || '2' }}
          MAX_RETRIES: ${{ inputs.max_retries || '2' }}
          RETRY_RUN_ID: ${{ inputs.retry_run_id || github.run_id }}
          CURRENT_ATTEMPT: ${{ env.ATTEMPT }}
          NEXT_ATTEMPT: ${{ steps.execution-context.outputs.next_attempt }}
          SOURCE_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          FAILED_SCENARIOS="$(jq -r '.totalFailedScenarios' artifacts/retry/retry-plan.json)"

          if [ "$FAILED_SCENARIOS" -eq 0 ]; then
            echo "No failed scenarios remain. No retry will be dispatched."
            exit 0
          fi

          if [ "$CURRENT_ATTEMPT" -ge "$MAX_RETRIES" ]; then
            echo "Maximum retry attempts reached ($MAX_RETRIES). No retry will be dispatched."
            exit 0
          fi

          echo "Dispatching automatic retry..."
          echo "Logical run ID: $RETRY_RUN_ID"
          echo "Retry attempt: $NEXT_ATTEMPT"
          echo "Source workflow run ID: $SOURCE_WORKFLOW_RUN_ID"

          gh workflow run e2e.yml \
            --repo "$REPOSITORY" \
            --ref "$BRANCH" \
            -f branch="$BRANCH" \
            -f tag="$TAG" \
            -f scenarios_per_shard="$SCENARIOS_PER_SHARD" \
            -f max_retries="$MAX_RETRIES" \
            -f execution_mode=automatic-retry \
            -f retry_run_id="$RETRY_RUN_ID" \
            -f retry_attempt="$NEXT_ATTEMPT" \
            -f source_workflow_run_id="$SOURCE_WORKFLOW_RUN_ID"
